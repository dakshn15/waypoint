version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: waypoint-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: waypoint
    ports:
      - '5432:5432'
    volumes:
      - waypoint_postgres_data:/var/lib/postgresql/data

volumes:
  waypoint_postgres_data:
